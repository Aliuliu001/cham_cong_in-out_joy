<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Check-in Joy</title>
<style>
  * { box-sizing: border-box; }
  body { margin: 0; background: #F6F3EE; font-family: -apple-system, Arial, sans-serif; }
  .box { max-width: 420px; margin: 16px auto; background: #fff; border-radius: 18px;
         box-shadow: 0 2px 12px rgba(0,0,0,.08); padding: 25px; }
  h1 { text-align: center; margin: 0 0 16px; font-size: 24px; color: #5C4A3A; }
  label { display: block; margin: 12px 0 4px; font-weight: bold; }
  select, input[type=text] { width: 100%; padding: 12px; font-size: 16px;
    border: 1px solid #ccc; border-radius: 10px; }
  .typetabs { display: flex; gap: 10px; margin-bottom: 6px; }
  .typetabs button { flex: 1; padding: 14px; font-size: 18px; font-weight: bold;
    border: 2px solid #ccc; border-radius: 12px; background: #fff; }
  .typetabs button.on-in { border-color: #28a745; background: #e8f8ec; color: #1a7a33; }
  .typetabs button.on-out { border-color: #e67e22; background: #fef3e6; color: #b35a00; }
  .status { background: #f2f2f2; border-radius: 10px; padding: 10px; margin-top: 12px; font-size: 15px; }
  #btn { width: 100%; margin-top: 16px; padding: 16px; font-size: 19px; font-weight: bold;
    color: #fff; background: #5C4A3A; border: none; border-radius: 12px; }
  #btn:disabled { background: #c9bfae; }
  #preview { width: 100%; border-radius: 10px; margin-top: 8px; display: none; }
  .err { color: #c00; margin-top: 8px; font-weight: bold; }
  .ok { color: #1a7a33; margin-top: 8px; font-weight: bold; }
  .hint { font-size: 13px; color: #555; margin-top: 6px; }
</style>
</head>
<body>
<div class="box">
  <h1>📍 CHECK IN</h1>

  <div class="typetabs">
    <button id="tIn" type="button" onclick="chon('IN')">🟢 VÀO</button>
    <button id="tOut" type="button" onclick="chon('OUT')">🟠 RA</button>
  </div>

  <label>Mã nhân viên</label>
  <select id="ma"><option value="">-- Chọn mã --</option></select>

  <label>Họ và tên nhân viên</label>
  <input type="text" id="ten" readonly placeholder="Chọn mã, tên tự hiện">

  <label>Ca hôm nay</label>
  <select id="ca"><option value="">-- Chưa có lịch / chọn sau --</option></select>

  <label>📸 Chụp ảnh khuôn mặt</label>
  <input type="file" id="photo" accept="image/*" capture="user">
  <img id="preview" alt="Ảnh đã chụp">
  <div class="hint">Chụp mặt lúc này, không dùng ảnh cũ. Ảnh giữ nguyên, không lật.</div>

  <div class="status">🕐 Thời gian:<br><b id="time">Đang xác định...</b></div>
  <div class="status">📍 Vị trí:<br><b id="gps">Đang xác định...</b></div>
  <div class="hint">Lần đầu iPhone hỏi "Cho phép vị trí / camera" — bấm <b>Cho phép</b>.
    Nếu bấm nhầm Từ chối: vào Cài đặt → Safari → Vị trí/Camera → bật lại.</div>

  <button id="btn" disabled>XÁC NHẬN CHECK IN</button>
  <div id="msg"></div>
</div>

<script>
var openTs = 0, openText = '', lat = 0, lng = 0, acc = 0, photoB64 = '',
    loai = '', caBd = '', caLabel = '', confirmed = false;
var nvMap = {};

function chon(t) {
  loai = t;
  document.getElementById('tIn').className = t === 'IN' ? 'on-in' : '';
  document.getElementById('tOut').className = t === 'OUT' ? 'on-out' : '';
  checkReady();
}

window.onload = function () {
  google.script.run.withSuccessHandler(function (r) {
    openTs = r.ts; openText = r.text;
    document.getElementById('time').textContent = openText;
    checkReady();
  }).getStartTime();
  google.script.run.withSuccessHandler(function (list) {
    var s = document.getElementById('ma');
    list.forEach(function (n) {
      nvMap[n.ma] = n.ten;
      var o = document.createElement('option');
      o.value = n.ma; o.textContent = n.ma + ' - ' + n.ten;
      s.appendChild(o);
    });
  }).getNhanVienList();
  if (navigator.geolocation) {
    navigator.geolocation.getCurrentPosition(function (p) {
      lat = p.coords.latitude; lng = p.coords.longitude; acc = Math.round(p.coords.accuracy || 0);
      document.getElementById('gps').textContent = 'Đã xác định (±' + acc + 'm)' +
        (acc > 100 ? ' — chỗ này GPS yếu, bạn ra chỗ thoáng thử lại nhé.' : '');
      checkReady();
    }, function () {
      document.getElementById('gps').textContent = 'Bạn cần cho phép trình duyệt sử dụng vị trí.';
    }, { enableHighAccuracy: true, timeout: 15000, maximumAge: 0 });
  } else {
    document.getElementById('gps').textContent = 'Máy này không lấy được vị trí GPS.';
  }
  document.getElementById('ma').onchange = function () {
    document.getElementById('ten').value = nvMap[this.value] || '';
    var ma = this.value;
    var c = document.getElementById('ca');
    c.innerHTML = '<option value="">-- Đang tải lịch... --</option>';
    google.script.run.withSuccessHandler(function (lich) {
      c.innerHTML = '';
      if (!lich.length) c.innerHTML = '<option value="">-- Hôm nay không có ca --</option>';
      lich.forEach(function (l, i) {
        var o = document.createElement('option');
        o.value = i; o.textContent = l.ca + ' ' + l.bd + '-' + l.kt;
        c.appendChild(o);
      });
      setCa(lich);
      c.onchange = function () { setCa(lich); };
    }).getLichHomNay(ma);
    checkReady();
  };
  document.getElementById('photo').onchange = function () {
    var f = this.files[0];
    if (!f) return;
    var img = new Image();
    img.onerror = function () {
      document.getElementById('msg').className = 'err';
      document.getElementById('msg').textContent = 'Ảnh lỗi, bạn chụp lại giúp mình.';
    };
    img.onload = function () {
      // Nén ảnh bằng canvas, GIỮ NGUYÊN hướng (không dùng ctx.scale(-1,1))
      // Ảnh nhỏ (~100-150KB) để gửi nhanh, không treo ở mạng yếu
      var max = 800, w = img.width, h = img.height;
      if (w > max || h > max) {
        var r = Math.min(max / w, max / h);
        w = Math.round(w * r); h = Math.round(h * r);
      }
      var cv = document.createElement('canvas');
      cv.width = w; cv.height = h;
      cv.getContext('2d').drawImage(img, 0, 0, w, h);
      var url = cv.toDataURL('image/jpeg', 0.6);
      photoB64 = url.split(',')[1];
      URL.revokeObjectURL(img.src);
      var pv = document.getElementById('preview');
      pv.src = url; pv.style.display = 'block';
      checkReady();
    };
    img.src = URL.createObjectURL(f);
  };
};

function setCa(lich) {
  var c = document.getElementById('ca');
  var l = lich[Number(c.value) || 0];
  if (l) { caBd = l.bd; caLabel = l.ca + ' ' + l.bd + '-' + l.kt; }
  else { caBd = ''; caLabel = ''; }
}

function checkReady() {
  var ok = openTs && lat && lng && photoB64 &&
           document.getElementById('ma').value && loai;
  document.getElementById('btn').disabled = !ok;
}

document.getElementById('btn').onclick = function () {
  var m = document.getElementById('msg');
  var btn = document.getElementById('btn');
  m.className = ''; m.textContent = 'Đang gửi... (tầm 10-20 giây, đừng tắt trang)';
  btn.disabled = true;
  // Tự báo nếu quá 45 giây chưa xong (thường do mạng yếu)
  var timeoutId = setTimeout(function () {
    if (m.textContent.indexOf('Đang gửi') === 0) {
      m.className = 'err';
      m.textContent = 'Gửi lâu quá (mạng yếu). Bạn bấm nút lại 1 lần giúp mình.';
      btn.disabled = false;
    }
  }, 45000);
  var now = new Date();
  var pad = function (n) { return (n < 10 ? '0' : '') + n; };
  var submitText = pad(now.getDate()) + '/' + pad(now.getMonth() + 1) + '/' +
    now.getFullYear() + ' ' + pad(now.getHours()) + ':' + pad(now.getMinutes()) + ':' + pad(now.getSeconds());
  google.script.run.withSuccessHandler(function (r) {
    clearTimeout(timeoutId);
    if (r.ok) {
      m.className = 'ok';
      m.innerHTML = '✅ CHECK IN THÀNH CÔNG!<br>🕐 Thời gian: ' + r.time +
        '<br>📍 Khoảng cách: ' + r.distance + ' m' +
        (r.lateMin > 0 ? '<br>⏰ Trễ: ' + r.lateMin + ' phút' : '');
      document.getElementById('btn').style.display = 'none';
    } else if (r.needConfirm) {
      if (confirm(r.msg)) { confirmed = true; document.getElementById('btn').click(); }
    } else {
      m.className = 'err';
      m.textContent = (r.outOfRange ? '❌ ' : '') + r.msg;
    }
  }).submitCheckin({
    ma: document.getElementById('ma').value,
    ten: document.getElementById('ten').value,
    lat: lat, lng: lng, photo: photoB64, type: loai,
    openTs: openTs, openText: openText, submitText: submitText,
    caBd: caBd, caLabel: caLabel, confirmed: confirmed
  }).withFailureHandler(function (e) {
    clearTimeout(timeoutId);
    m.className = 'err';
    m.textContent = 'Gửi lỗi: ' + (e && e.message ? e.message : 'mạng yếu, bạn bấm lại giúp mình.');
    btn.disabled = false;
  });
};
</script>
</body>
</html>
