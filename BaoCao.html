<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Báo cáo chấm công</title>
<style>
  * { box-sizing: border-box; }
  body { margin: 0; background: #F6F3EE; font-family: -apple-system, Arial, sans-serif; color: #333; }
  .box { max-width: 96%; margin: 16px auto; background: #fff; border-radius: 18px;
         box-shadow: 0 2px 12px rgba(0,0,0,.08); padding: 25px; }
  h1 { text-align: center; margin: 0 0 6px; font-size: 22px; color: #5C4A3A; }
  .sub { text-align: center; color: #888; font-size: 14px; margin-bottom: 14px; }
  .tabs { display: flex; gap: 8px; margin-bottom: 14px; }
  .tabs button { flex: 1; padding: 12px; font-size: 16px; font-weight: bold; border-radius: 12px;
    border: 2px solid #ddd; background: #fff; color: #555; }
  .tabs button.on { border-color: #5C4A3A; background: #F6F3EE; color: #5C4A3A; }
  .row { display: flex; gap: 8px; margin-bottom: 10px; align-items: center; }
  input { flex: 1; padding: 12px; font-size: 16px; border-radius: 10px; border: 1px solid #ccc; }
  .go { border: none; background: #5C4A3A; color: #fff; font-weight: bold; border-radius: 10px; padding: 12px 18px; font-size: 16px; }
  .cards { display: flex; gap: 8px; margin: 12px 0; flex-wrap: wrap; }
  .card { flex: 1; min-width: 100px; background: #F6F3EE; border-radius: 12px; padding: 10px; text-align: center; }
  .card b { display: block; font-size: 22px; color: #5C4A3A; }
  .card span { font-size: 13px; color: #777; }
  .card.warn b { color: #c00; }
  table { width: 100%; border-collapse: collapse; font-size: 14px; margin-top: 10px; }
  th, td { border: 1px solid #e5ddd2; padding: 8px; text-align: left; }
  th { background: #F6F3EE; color: #5C4A3A; }
  .tre { color: #c00; font-weight: bold; }
  .okc { color: #1a7a33; font-weight: bold; }
  .miss { background: #fff3f3; border-radius: 12px; padding: 12px; margin-top: 12px; }
  .miss b { color: #c00; }
  .anh { font-size: 13px; }
  .actions { display:flex; flex-wrap:wrap; gap:8px; }
  .actions .go { max-width:100%; }
  .status { margin:10px 0; white-space:pre-wrap; }
  .file-links a { display:inline-block; margin:5px 12px 5px 0; }
  .go:disabled { opacity:.55; cursor:wait; }
  .preview-table { overflow:auto; max-height:360px; }
  .preview-table table { min-width:max-content; }
  @media (max-width:600px) { .box { padding:14px; } .actions .go { width:100%; } }
</style>
</head>
<body>
<div class="box">
  <h1>📊 Báo cáo chấm công</h1>
  <div class="sub" id="today"></div>
  <div class="tabs">
    <button id="tabNgay" class="on" onclick="doiTab('ngay')">Hôm nay (Ngày)</button>
    <button id="tabThang" onclick="doiTab('thang')">Tổng hợp Tháng</button>
  </div>

  <div id="pNgay">
    <div class="row">
      <label style="font-weight:bold; min-width:50px;">Chọn ngày:</label>
      <input type="date" id="ngayPicker" onchange="chonNgayPicker()">
      <input id="ngay" placeholder="dd/MM/yyyy" style="max-width:130px">
      <button class="go" onclick="xemNgay()">Xem</button>
    </div>
    <div id="kqNgay"></div>
  </div>

  <div id="pThang" style="display:none">
    <div class="row">
      <label style="font-weight:bold; min-width:50px;">Chọn tháng:</label>
      <input id="thang" placeholder="MM/yyyy (VD: 09/2026)" style="max-width:160px">
      <button class="go" onclick="xemThang()">👀 Xem báo cáo tháng</button>
    </div>
    <div id="kqThang"></div>
    <section style="margin-top:22px;padding:16px;border:1px solid #e5ddd2;border-radius:14px;background:#fffdf9">
      <h2 style="margin:0 0 8px;color:#5C4A3A;font-size:18px">📤 Chấm công gửi Bảng lương</h2>
      <p>File chỉ dùng để đối chiếu. Không tự tính tiền lương hay sửa dữ liệu chấm công.</p>
      <div class="actions"><button id="btnPreviewLuong" class="go" onclick="xemBangLuong()">👀 Xem trước dữ liệu</button><button id="btnExcelLuong" class="go" onclick="taiBangLuong()">⬇️ Tải Excel cho Bảng lương</button></div>
      <div id="statusPreview" class="status" role="status" aria-live="polite"></div>
      <div id="previewLuong"></div>
      <div id="statusExcel" class="status" role="status" aria-live="polite"></div>
      <div id="excelLinks" class="file-links"></div>
    </section>
    <section style="margin-top:18px;padding:16px;border:1px solid #e5ddd2;border-radius:14px">
      <h2 style="margin:0 0 8px;color:#5C4A3A;font-size:18px">🔒 Chốt tháng</h2>
      <p>Chỉ chốt sau khi đã kiểm tra CHECK IN và LICHLAM. Không bấm để thử trên dữ liệu thật.</p>
      <button id="btnChotThang" class="go" onclick="chotThang()">🔒 Chốt tháng</button>
      <div id="statusChot" class="status" role="status" aria-live="polite"></div>
    </section>
  </div>
</div>

<script>
var tab = 'ngay';
var lastThangRequest = 0;
var previewBusy = false, excelBusy = false, chotBusy = false;
function thangHopLe(statusId) {
  var th = document.getElementById('thang').value.trim();
  if (!/^(0[1-9]|1[0-2])\/\d{4}$/.test(th)) {
    document.getElementById(statusId).textContent = 'Nhập tháng theo MM/yyyy, ví dụ 10/2026.';
    return null;
  }
  return th;
}
function doiTab(t) {
  tab = t;
  document.getElementById('tabNgay').className = t === 'ngay' ? 'on' : '';
  document.getElementById('tabThang').className = t === 'thang' ? 'on' : '';
  document.getElementById('pNgay').style.display = t === 'ngay' ? '' : 'none';
  document.getElementById('pThang').style.display = t === 'thang' ? '' : 'none';
  if (t === 'thang' && !document.getElementById('kqThang').innerHTML) xemThang();
}
function homNay() {
  var d = new Date(), p = function (n) { return (n < 10 ? '0' : '') + n; };
  return p(d.getDate()) + '/' + p(d.getMonth() + 1) + '/' + d.getFullYear();
}
function thangNay() {
  var d = new Date(), p = function (n) { return (n < 10 ? '0' : '') + n; };
  return p(d.getMonth() + 1) + '/' + d.getFullYear();
}
function toISO(vn) {
  var p = vn.split('/');
  return p.length === 3 ? p[2] + '-' + p[1] + '-' + p[0] : '';
}
function toVN(iso) {
  var p = iso.split('-');
  return p.length === 3 ? p[2] + '/' + p[1] + '/' + p[0] : '';
}
function chonNgayPicker() {
  var iso = document.getElementById('ngayPicker').value;
  if (iso) {
    document.getElementById('ngay').value = toVN(iso);
    xemNgay();
  }
}
window.onload = function () {
  document.getElementById('today').textContent = 'Hôm nay: ' + homNay();
  var h = homNay();
  document.getElementById('ngay').value = h;
  document.getElementById('ngayPicker').value = toISO(h);
  document.getElementById('thang').value = thangNay();
  xemNgay();
};
function xemNgay() {
  var ngay = document.getElementById('ngay').value.trim() || homNay();
  var iso = toISO(ngay);
  if (iso) document.getElementById('ngayPicker').value = iso;
  var kq = document.getElementById('kqNgay');
  kq.textContent = 'Đang tải...';
  var loi = function (e) {
    kq.innerHTML = '<p style="color:#c00;font-weight:bold">Không tải được báo cáo: ' +
      ((e && e.message) || 'máy bận, bạn bấm Xem lại giúp mình.') + '</p>';
  };
  google.script.run.withSuccessHandler(function (rs) {
    google.script.run.withSuccessHandler(function (vang) {
      var soTre = 0, soQuen = 0;
      rs.forEach(function (r) { soTre += r.soLanTre; soQuen += r.quenRA; });
      var h = '<div class="cards">' +
        '<div class="card"><b>' + rs.length + '</b><span>Đã chấm</span></div>' +
        '<div class="card' + (soTre ? ' warn' : '') + '"><b>' + soTre + '</b><span>Ca trễ</span></div>' +
        '<div class="card' + (soQuen ? ' warn' : '') + '"><b>' + soQuen + '</b><span>Nhớ check out</span></div>' +
        '<div class="card' + (vang.length ? ' warn' : '') + '"><b>' + vang.length + '</b><span>Chưa chấm</span></div>' +
        '</div>';
      if (!rs.length) h += '<p>Chưa ai chấm ngày này.</p>';
      else {
        h += '<table><tr><th>Mã</th><th>Họ và tên</th><th>Ngày</th><th>Ca</th><th>Loại</th><th>Giờ IN</th><th>Giờ OUT</th><th>Trễ (phút)</th><th>Ghi chú</th><th>Link ảnh</th><th>Khoảng cách</th></tr>';
        rs.forEach(function (r) {
          r.caps.forEach(function (c, i) {
            var ghiChu = c.note || '';
            if (!ghiChu && c.thieuRA) ghiChu = '⚠️ Chưa check out';
            if (c.tre > 0 && c.tre >= 15) ghiChu = (ghiChu ? ghiChu + ' | ' : '') + '⏰ Trễ ' + c.tre + 'p';
            if (c.kc && c.kc > 50) ghiChu = (ghiChu ? ghiChu + ' | ' : '') + '📍 GPS: ' + c.kc + 'm';
            
            h += '<tr>' +
              '<td><b>' + r.ma + '</b></td>' +
              '<td>' + r.ten + '</td>' +
              '<td>' + ngay + '</td>' +
              '<td>' + (c.ca || '—') + '</td>' +
              '<td>' + (c.type || (c.vao ? 'IN' : 'OUT')) + '</td>' +
              '<td>' + (c.vao || '') + '</td>' +
              '<td>' + (c.ra || '') + '</td>' +
              '<td>' + (c.tre > 0 ? c.tre : '') + '</td>' +
              '<td>' + ghiChu + '</td>' +
              '<td>' + (c.anh ? '<a class="anh" href="' + c.anh + '" target="_blank">Xem</a>' : '') + '</td>' +
              '<td>' + (c.kc || '') + '</td>' +
              '</tr>';
          });
        });
        h += '</table>';
      }
      if (vang.length) {
        var chuaChamHien = [], quaGioHien = [];
        vang.forEach(function (v) {
          if (v.cas && v.cas.length) chuaChamHien.push(v.ma + ' ' + v.ten + ' (' + v.cas.join(', ') + ')');
          if (v.casQuaGio && v.casQuaGio.length) quaGioHien.push(v.ma + ' ' + v.ten + ' (' + v.casQuaGio.join(', ') + ')');
        });
        if (chuaChamHien.length) {
          h += '<div class="miss"><b>⚠️ Chưa chấm (' + chuaChamHien.length + '):</b><br>' + chuaChamHien.join('<br>') + '</div>';
        }
        if (quaGioHien.length) {
          h += '<div class="miss"><b>🔴 Vắng không báo — ca đã hết giờ (' + quaGioHien.length + '):</b><br>' + quaGioHien.join('<br>') + '</div>';
        }
      }
      kq.innerHTML = h;
    }).withFailureHandler(loi).getChuaCham(ngay);
  }).withFailureHandler(loi).getBaoCaoNgay(ngay);
}
function xemThang() {
  var th = thangHopLe('kqThang');
  if (!th) return;
  var kq = document.getElementById('kqThang');
  kq.textContent = 'Đang tải...';
  var requestThang = ++lastThangRequest;
  var loi = function (e) {
    if (requestThang !== lastThangRequest) return;
    kq.textContent = 'Không tải được báo cáo: ' + ((e && e.message) || 'máy bận, bạn bấm Xem lại giúp mình.');
  };
  google.script.run.withSuccessHandler(function (list) {
    if (requestThang !== lastThangRequest) return;
    if (!list.length) { kq.textContent = 'Chưa có dữ liệu tháng này.'; return; }
    var h = '<p><b>Bảng tổng hợp tất cả nhân viên — Tháng ' + th + '</b></p>';
    h += '<table><tr><th>Mã</th><th>Họ tên</th><th>Tổng giờ</th><th>Giờ tăng cường</th><th>Số ca</th><th>Trễ IN</th><th>Quên IN</th><th>Quên OUT</th><th>Vắng có phép</th><th>Vắng không báo</th><th>KPI</th></tr>';
    list.forEach(function (r) {
      h += '<tr>' +
        '<td><b>' + r.ma + '</b></td>' +
        '<td>' + r.ten + '</td>' +
        '<td><b>' + r.tongGio + 'h</b></td>' +
        '<td>' + r.gioTangCuong + 'h</td>' +
        '<td>' + r.soCa + '</td>' +
        '<td class="' + (r.soLanTreThucTe ? 'tre' : '') + '">' + (r.soLanTreThucTe || 0) + '</td>' +
        '<td class="' + (r.soLanQuenIN ? 'tre' : '') + '">' + r.soLanQuenIN + '</td>' +
        '<td class="' + (r.soLanQuenRA ? 'tre' : '') + '">' + r.soLanQuenRA + '</td>' +
        '<td>' + (r.soVangCoPhep || 0) + '</td>' +
        '<td class="' + (r.soVangKhongBao ? 'tre' : '') + '">' + (r.soVangKhongBao || 0) + '</td>' +
        '<td class="' + (r.kpi < 100 ? 'tre' : 'okc') + '"><b>' + r.kpi + '%</b></td>' +
        '</tr>';
      if (r.vangKhongBaoChiTiet && r.vangKhongBaoChiTiet.length) {
        h += '<tr><td></td><td colspan="10" style="color:#c00">🔴 Vắng không báo: ' +
          r.vangKhongBaoChiTiet.map(function (x) { return x.ngay + ' (' + x.ca + ')'; }).join('; ') + '</td></tr>';
      }
    });
    h += '</table>';
    kq.innerHTML = h;
  }).withFailureHandler(loi).getBaoCaoThangTatCa(th);
}
function escLuong(x) { return String(x == null ? '' : x).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
function bangLuongHtml(title, headers, rows) {
  var h='<h3 style="color:#5C4A3A">'+escLuong(title)+'</h3><div class="preview-table"><table><thead><tr>';
  headers.forEach(function(x){h+='<th>'+escLuong(x)+'</th>';});h+='</tr></thead><tbody>';
  rows.forEach(function(row){h+='<tr>';row.forEach(function(x){h+='<td>'+escLuong(x)+'</td>';});h+='</tr>';});return h+'</tbody></table></div>';
}
function xemBangLuong() {
  if (previewBusy) return;
  var th = thangHopLe('statusPreview'); if (!th) return;
  var btn = document.getElementById('btnPreviewLuong'), status = document.getElementById('statusPreview');
  var box = document.getElementById('previewLuong');
  previewBusy = btn.disabled = true;
  box.textContent = '';
  status.textContent = '⏳ Đang đọc dữ liệu tháng ' + th + '…';
  google.script.run.withSuccessHandler(function(data) {
    previewBusy = btn.disabled = false;
    if (!data || !data.detailHeaders || !data.detailRows || !data.summaryHeaders || !data.weekHeaders) {
      status.textContent = '❌ Không đọc được dữ liệu: Kết quả không hợp lệ. Chưa có tệp nào được tạo.'; return;
    }
    var n = data.detailRows.length;
    box.innerHTML = bangLuongHtml('Tổng hợp giáo viên', data.summaryHeaders, data.summaryRows || []) +
      bangLuongHtml('Chi tiết ca', data.detailHeaders, data.detailRows) +
      bangLuongHtml('Giờ tuần', data.weekHeaders, data.weekRows || []);
    var sources = n && data.detailRows[0].slice(20,22).join(' / ');
    status.textContent = n ? '✅ Đã tải ' + n + ' ca. Bảng có 3 phần: Tổng hợp giáo viên, Chi tiết ca, Giờ tuần. Kéo ngang bảng Chi tiết ca để xem đủ 25 cột. Nguồn: ' + sources :
      'Tháng này chưa có ca để xem. Hãy kiểm tra tháng đã chọn và lịch làm.';
  }).withFailureHandler(function(e) {
    previewBusy = btn.disabled = false;
    status.textContent = '❌ Không đọc được dữ liệu: ' + ((e && e.message) || 'Lỗi không rõ') + '. Chưa có tệp nào được tạo.';
  }).previewPayrollWorkbook(th);
}
function taiBangLuong() {
  if (excelBusy) return;
  var th = thangHopLe('statusExcel'); if (!th) return;
  var btn = document.getElementById('btnExcelLuong'), status = document.getElementById('statusExcel');
  var links = document.getElementById('excelLinks');
  excelBusy = btn.disabled = true;
  links.textContent = '';
  status.textContent = '⏳ Đang tạo Excel tháng ' + th + '. Xin đợi…';
  google.script.run.withSuccessHandler(function(f) {
    excelBusy = btn.disabled = false;
    if (!f || !/^https:\/\/docs\.google\.com\/spreadsheets\/d\/[\w-]+\/export\?format=xlsx$/.test(f.url)) {
      status.textContent = '❌ Chưa tải được Excel: Máy chủ không trả link Excel hợp lệ. Không có dữ liệu gốc nào bị sửa.'; return;
    }
    var open = document.createElement('a'); open.href = f.url.replace('/export?format=xlsx', '/edit');
    open.target = '_blank'; open.rel = 'noopener noreferrer'; open.textContent = '📄 Mở file Excel vừa tạo';
    var download = document.createElement('a'); download.href = f.url;
    download.target = '_blank'; download.rel = 'noopener noreferrer'; download.textContent = '⬇️ Tải file Excel';
    links.appendChild(open); links.appendChild(download);
    status.textContent = '✅ Đã tạo file Excel tháng ' + th + '. Hãy xem trước để kiểm tra số ca; tháng trống có thể chỉ có hàng tiêu đề. Nếu trình duyệt không tự tải, bấm link trên để mở rồi chọn Tệp → Tải xuống → Microsoft Excel (.xlsx).';
    // Click may be blocked by Apps Script's sandbox; links remain available either way.
    try { download.click(); } catch (ignored) {}
  }).withFailureHandler(function(e) {
    excelBusy = btn.disabled = false;
    status.textContent = '❌ Chưa tải được Excel: ' + ((e && e.message) || 'Lỗi không rõ') + '. Không có dữ liệu gốc nào bị sửa.';
  }).exportPayrollAttendanceXlsx(th);
}
function chotThang() {
  if (chotBusy) return;
  var th = thangHopLe('statusChot'); if (!th) return;
  if (!confirm('Chốt tháng ' + th + '? Hãy kiểm tra CHECK IN và LICHLAM trước khi chốt.')) return;
  var btn = document.getElementById('btnChotThang'), status = document.getElementById('statusChot');
  chotBusy = btn.disabled = true;
  status.textContent = '⏳ Đang chốt tháng ' + th + '…';
  function finish(msg) { chotBusy = btn.disabled = false; status.textContent = msg; }
  function fail(e) { finish('❌ Không chốt được: ' + ((e && e.message) || 'Lỗi không rõ')); }
  google.script.run.withSuccessHandler(function(r) {
    if (r && r.ok) return finish('✅ ' + r.msg);
    if (r && r.exists) {
      if (!confirm('Tháng ' + th + ' đã có bản chốt. Giữ bản cũ hay chốt lại?\n\nBấm OK để chốt lại, Hủy để giữ bản cũ.')) return finish('Đã giữ bản chốt cũ.');
      status.textContent = '⏳ Đang chốt lại tháng ' + th + '…';
      google.script.run.withSuccessHandler(function(x) {
        finish(x && x.ok ? '✅ ' + x.msg : '❌ Không chốt được: ' + ((x && x.msg) || 'Lỗi không rõ'));
      }).withFailureHandler(fail).chotThangAnToan(th, true);
    } else finish('❌ Không chốt được: ' + ((r && r.msg) || 'Lỗi không rõ'));
  }).withFailureHandler(fail).chotThangAnToan(th, false);
}
</script>
</body>
</html>
